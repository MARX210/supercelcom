<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Super Cell — Painel do dono (protótipo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#0b1530;--mut:#5d6985;--bd:#dfe4f0;--bl:#2f7bff;--or:#e8860c;--ok:#12a150;--rd:#e5202f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030b1f;--card:#0d1a38;--tx:#f2f5fc;--mut:#9aa8c7;--bd:#1d2c52;--or:#ff9a1f}}
:root[data-theme="dark"]{--bg:#030b1f;--card:#0d1a38;--tx:#f2f5fc;--mut:#9aa8c7;--bd:#1d2c52;--or:#ff9a1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
h1,h2,h3,b{font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
header h1{font-size:18px}header h1 i{font-style:normal;color:var(--or)}
button,select,input{font:inherit;color:inherit}
.bt{border:0;background:var(--bl);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;cursor:pointer}
.bt:disabled{opacity:.4}.bt.g{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.w{padding:0 16px 16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k small{color:var(--mut);display:block;font-size:12px}.k b{font-size:20px}
h2{font-size:16px;margin:16px 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row small{color:var(--mut);display:block}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bd);white-space:nowrap}
.chip.disponivel{background:#12a15022;color:var(--ok)}.chip.vendido{background:#5d698522;color:var(--mut)}.chip.avaliacao,.chip.troca{background:#ff9a1f26;color:var(--or)}
.bar{height:8px;border-radius:9px;background:var(--bl);margin-top:5px}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.f input,.f select,.bar2 input,.bar2 select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:480px){.two.st{grid-template-columns:minmax(0,1fr)}}
input[type=date]{min-width:0;max-width:100%;min-height:44px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.pv{margin:4px 0;font-size:13px;color:var(--mut)}.pv.atraso{color:var(--rd);font-weight:600}
.chip.atraso{background:#e5202f1f;color:var(--rd)}
.pg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.sm{padding:12px;border-radius:12px;font-weight:700;text-align:center;margin:12px 0}
.sm.ok{background:#12a15022;color:var(--ok)}.sm.no{background:#e5202f1f;color:var(--rd)}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:var(--mut);cursor:pointer}
.tab button b{display:block;font-size:19px}.tab button.on{color:var(--bl)}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);width:min(94vw,520px);max-height:88vh;padding:18px}
dialog::backdrop{background:#000a}
.nt{color:var(--mut);font-size:12px;margin-top:8px}
.lg{max-width:380px;margin:12vh auto 0;padding:0 16px}
.lg h1{font-size:26px;margin-bottom:6px}.lg .f{margin:16px 0}
.pill{background:#ff9a1f26;color:var(--or);border-radius:10px;padding:8px 12px;font-size:13px;margin:10px 0}
[hidden]{display:none!important}
#rcb{display:none}
@media print{body>*:not(#rcb){display:none!important}html,body{background:#fff!important;padding:0!important}#rcb{display:block!important;color:#000;background:#fff;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;max-width:80mm;margin:0 auto;padding:4mm}#rcb h2{font-size:16px;text-align:center;margin:0 0 4px}#rcb p{margin:4px 0}#rcb .c{text-align:center}#rcb .l{display:flex;justify-content:space-between;gap:8px}#rcb hr{border:0;border-top:1px dashed #000;margin:6px 0}@page{margin:6mm}}
.cg{display:grid;gap:12px}.cg .card{margin:0}
.chip.esgotado,.chip.low{background:#e5202f1f;color:var(--rd)}
@media(min-width:900px){body{padding-left:220px}.tab{top:0;right:auto;bottom:0;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:72px 10px 10px}.tab button{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;font-size:15px;border-radius:10px}.tab button.on{background:var(--bg)}.tab button b{display:inline;font-size:18px}.w{max-width:1040px}.grid{grid-template-columns:repeat(3,1fr)}.cg{grid-template-columns:1fr 1fr}.cg .wide{grid-column:1/-1}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="rcb"></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const R=v=>{const s=String(v).trim();const n=s.includes(',')?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s);return isNaN(n)?0:Math.round(n*100)};
const T=c=>c?(c/100).toFixed(2).replace('.',','):'';
const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const days=d=>Math.floor((Date.now()-new Date(d))/864e5);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const CATS={celulares:'Celulares',smartwatches:'Smartwatches','caixas-de-som':'Caixas de som',fones:'Fones de ouvido','peliculas-e-acessorios':'Películas e acessórios'};
const CT={celulares:'a',smartwatches:'a','caixas-de-som':'c',fones:'c','peliculas-e-acessorios':'c'};
const TN={a:'Aparelho',c:'Acessório'};
const ST={disponivel:'Disponível',esgotado:'Esgotado',reservado:'Reservado p/ encomenda',avaliacao:'Aguardando avaliação',troca:'Recebido em troca',fora:'Fora de venda'};
const FP=['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Transferência'];
const DEST={troca:'Adicionar ao estoque',avaliacao:'Aguardar avaliação',nao:'Não adicionar ao estoque'};
const stt=p=>p.st==='disponivel'&&p.qtd<=0?'esgotado':p.st;
let nid=100;
const mp=(id,nome,cat,v,comp,cond,bat,custo,preco,promo,qtd,min,st,pub,ent)=>({id,nome,cat,v,comp,cond,bat,custo,preco,promo,qtd,min,st,pub,ent});
let P=[
mp(1,'iPhone 13','celulares','128 GB · Azul','','seminovo',88,210000,269900,0,3,0,'disponivel',1,day(40)),
mp(2,'iPhone 14 Pro','celulares','256 GB · Roxo','','seminovo',91,360000,449900,429900,1,0,'disponivel',1,day(14)),
mp(3,'Xiaomi Redmi Note','celulares','128 GB · Preto','','novo',0,98000,129900,0,2,0,'disponivel',1,day(5)),
mp(4,'Smartwatch Série 9','smartwatches','45 mm','','novo',0,60000,89900,79900,2,0,'disponivel',1,day(12)),
mp(5,'Caixa de som Bluetooth','caixas-de-som','Portátil','','novo',0,15000,24900,0,12,5,'disponivel',1,day(45)),
mp(6,'Fone de ouvido sem fio','fones','Branco','','novo',0,12000,19900,0,3,5,'disponivel',0,day(9)),
mp(7,'iPhone 12','celulares','Recebido em troca','','seminovo',84,100000,0,0,1,0,'troca',0,day(3)),
mp(8,'Capinha transparente','peliculas-e-acessorios','Transparente','iPhone 13','',0,1500,4900,0,120,30,'disponivel',1,day(20)),
mp(9,'Película de vidro','peliculas-e-acessorios','3D','iPhone 13 / 14','',0,500,2900,0,6,10,'disponivel',1,day(8)),
mp(10,'iPhone 15','celulares','128 GB · Azul','','novo',0,430000,520000,0,1,0,'reservado',0,day(1))];
const it=(nome,q,tab,fin,custo,cat)=>({pid:0,nome,q,tab,fin,custo,cat});
const mkS=(d,itens,pag,troca)=>({id:nid++,data:day(d),itens,pag,troca:troca||null,canc:0});
let S=[
mkS(13,[it('iPhone 11 · 128 GB',1,179900,169900,130000,'celulares')],[{f:'PIX',v:169900}]),
mkS(12,[it('Caixa de som Bluetooth',1,24900,22900,15000,'caixas-de-som')],[{f:'Dinheiro',v:22900}]),
mkS(9,[it('Xiaomi Poco · 256 GB',1,109900,109900,80000,'celulares')],[{f:'Cartão de crédito',v:109900}]),
mkS(8,[it('Capinha transparente',3,4900,4500,1500,'peliculas-e-acessorios'),it('Película de vidro',3,2900,2900,500,'peliculas-e-acessorios')],[{f:'PIX',v:22200}]),
mkS(6,[it('Smartwatch Série 9',1,89900,79900,60000,'smartwatches')],[{f:'Cartão de débito',v:79900}]),
mkS(5,[it('Fone de ouvido sem fio',2,19900,18900,12000,'fones')],[{f:'PIX',v:37800}]),
mkS(3,[it('iPhone 13 · 128 GB · Preto',1,259900,249900,205000,'celulares')],[{f:'PIX',v:149900}],{nome:'iPhone 12 · 64 GB',valor:100000,destino:'troca',pid:7}),
mkS(2,[it('iPhone 11 · 128 GB',1,179900,169900,130000,'celulares')],[{f:'PIX',v:100000},{f:'Dinheiro',v:69900}]),
mkS(1,[it('Xiaomi Redmi Note',1,129900,124900,98000,'celulares')],[{f:'Transferência',v:124900}]),
mkS(0,[it('Capinha transparente',2,4900,4900,1500,'peliculas-e-acessorios')],[{f:'Dinheiro',v:9800}])];
let E=[
{id:nid++,cliente:'Maria Souza',contato:'(46) 99999-0001',desc:'iPhone 16 Pro 256 GB Preto',preco:799000,prev:day(-7),st:'aguardando',pag:[{f:'PIX',v:200000,data:day(2)}],troca:null,pid:0,canc:0},
{id:nid++,cliente:'João Pereira',contato:'(46) 99999-0002',desc:'iPhone 15 128 GB Azul',preco:520000,prev:day(1),st:'chegou',pag:[{f:'PIX',v:100000,data:day(9)}],troca:{nome:'iPhone 12 · 64 GB',valor:150000,destino:'troca'},pid:10,canc:0}];
const encFl=x=>x.preco-sum(x.pag,g=>g.v)-(x.troca?x.troca.valor:0);
const hoje=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=d=>d.split('-').reverse().join('/');
const dif=d=>Math.round((new Date(d+'T00:00')-new Date(hoje()+'T00:00'))/864e5);
const encPrev=x=>{if(x.st!=='aguardando'||x.canc)return null;if(!x.prev)return{t:'Sem previsão definida (a confirmar)',k:''};const n=dif(x.prev);return n<0?{t:'Atrasada há '+(-n)+(n===-1?' dia':' dias')+' · era '+fd(x.prev),k:'atraso'}:n===0?{t:'Previsão: hoje',k:''}:{t:'Previsão: '+fd(x.prev)+' (em '+n+(n===1?' dia':' dias')+')',k:''}};
const atr=x=>{const p=encPrev(x);return p&&p.k==='atraso'?1:0};
const encRes=()=>{const o=E.filter(x=>!x.canc&&x.st!=='entregue');return{a:o.filter(x=>x.st==='aguardando').length,c:o.filter(x=>x.st==='chegou').length,at:o.filter(atr).length,rec:sum(o,x=>x.preco-encFl(x)),fl:sum(o,encFl)}};
let view='painel',V=null,F={q:'',c:'',s:''};
const tot=s=>sum(s.itens,i=>i.fin*i.q),live=()=>S.filter(s=>!s.canc),sname=s=>s.itens.map(i=>(i.q>1?i.q+'× ':'')+i.nome).join(' + ');
const blank=()=>({pid:'',nome:'',q:1,tab:0,final:0,custo:0,cat:''});

function login(){$('#app').innerHTML=`<div class="lg"><h1>Super <span style="color:var(--or)">Cell</span></h1><p style="color:var(--mut)">Painel do dono</p>
<div class="pill">Protótipo: qualquer usuário e senha entra. O login de verdade vem com o banco de dados.</div>
<form class="f" id="lf"><label>Usuário<input required autocomplete="username"></label><label>Senha<input type="password" required autocomplete="current-password"></label><button class="bt">Entrar</button></form></div>`;
$('#lf').onsubmit=x=>{x.preventDefault();shell()}}
function shell(){$('#app').innerHTML=`<header><h1>Super <i>Cell</i> · Painel</h1><button class="bt g" id="out">Sair</button></header><div class="w" id="v"></div>
<nav class="tab">${[['painel','▦','Painel'],['produtos','▤','Produtos'],['vender','＋','Vender'],['vendas','☰','Vendas'],['encomendas','⧗','Encomendas']].map(t=>`<button data-v="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`;
$('#out').onclick=login;document.querySelectorAll('.tab button').forEach(b=>b.onclick=()=>go(b.dataset.v));go(view)}
function go(n){view=n;if(n==='vender'&&!V)V={it:[blank()],pag:[{f:'PIX',v:0}],troca:0,tn:'',tv:0,td:'troca'};
document.querySelectorAll('.tab button').forEach(b=>b.classList.toggle('on',b.dataset.v===n));
$('#v').innerHTML=VW[n]();if(n==='vender')sumUp();scrollTo(0,0)}

const CL=['#2f7bff','#12a150','#e8860c','#9b59ff','#e5202f'];
const VW={
painel(){const L=live(),mo=day(0).slice(0,7),ms=L.filter(s=>s.data.startsWith(mo));
const fat=sum(ms,tot),rec=sum(ms,s=>sum(s.pag,p=>p.v)),tr=sum(ms,s=>s.troca?s.troca.valor:0),cu=sum(ms,s=>sum(s.itens,i=>i.custo*i.q));
const dp=P.filter(p=>p.st==='disponivel'),low=dp.filter(p=>p.min&&p.qtd<=p.min),old=dp.filter(p=>p.qtd>0&&days(p.ent)>=30).sort((a,b)=>days(b.ent)-days(a.ent));
const ds=[...Array(14)].map((_,i)=>{const d=day(13-i);return{d:d.slice(8),v:sum(L.filter(s=>s.data===d),tot)}}),mx=Math.max(1,...ds.map(x=>x.v));
const bars=ds.map((x,i)=>{const h=x.v/mx*88;return `<rect x="${i*22+6}" y="${100-h}" width="16" height="${h}" rx="3" fill="var(--bl)"><title>${x.d}: ${M(x.v)}</title></rect><text x="${i*22+14}" y="115" text-anchor="middle" font-size="9" fill="var(--mut)">${x.d}</text>`}).join('');
const by={};ms.forEach(s=>s.pag.forEach(p=>by[p.f]=(by[p.f]||0)+p.v));const tp=sum(Object.values(by),x=>x)||1;let ac=0;
const dn=Object.entries(by).map(([f,v],i)=>{const pc=v/tp*100,o=25-ac;ac+=pc;return `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${CL[i%5]}" stroke-width="7" stroke-dasharray="${pc} ${100-pc}" stroke-dashoffset="${o}"/>`}).join('');
const bc={};ms.forEach(s=>s.itens.forEach(i=>bc[i.cat]=(bc[i.cat]||0)+i.fin*i.q));const mc=Math.max(1,...Object.values(bc));
const k=(a,b)=>`<div class="k"><small>${a}</small><b>${b}</b></div>`;
return `<div class="grid">${k('Unidades em estoque',sum(dp,p=>p.qtd))}${k('Vendas no mês',ms.length)}${k('Valor negociado',M(fat))}${k('Dinheiro recebido',M(rec))}${k('Aceito em trocas',M(tr))}${k('Margem bruta (est.)',M(fat-cu))}</div>
<div class="cg"><div class="card wide"><b>Vendas por dia (últimos 14 dias)</b><svg viewBox="0 0 316 120" width="100%" style="margin-top:8px">${bars}</svg></div>
<div class="card"><b>Forma de pagamento (mês)</b>${Object.keys(by).length?`<div style="display:flex;gap:14px;align-items:center;margin-top:10px"><svg viewBox="0 0 42 42" width="110" height="110" style="flex:none;transform:rotate(0deg)"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="7"/>${dn}</svg><div style="flex:1">${Object.entries(by).map(([f,v],i)=>`<div class="row" style="padding:5px 0"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${CL[i%5]};margin-right:8px"></i>${f}</span><b>${M(v)}</b></div>`).join('')}</div></div>`:'<p class="nt">Sem vendas no mês.</p>'}</div>
<div class="card"><b>Vendido por categoria (mês)</b>${Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin-top:10px;display:flex;justify-content:space-between"><span>${e(CATS[c]||c)}</span><b>${M(v)}</b></div><div class="bar" style="width:${v/mc*100}%"></div>`).join('')||'<p class="nt">Sem vendas no mês.</p>'}</div>
<div class="card"><b>Repor estoque</b>${low.map(p=>`<div class="row"><span>${e(p.nome)}<small>${e([p.comp,p.v].filter(Boolean).join(' · '))} · avisar com até ${p.min}</small></span><span class="chip low">${p.qtd===0?'zerado':'restam '+p.qtd}</span></div>`).join('')||'<p class="nt">Nada abaixo do limite.</p>'}<p class="nt">Faça o pedido ao fornecedor desses itens.</p></div>
<div class="card"><b>Encomendas abertas</b>${(r=>`<div class="row"><span>Aguardando chegar</span><b>${r.a}</b></div>${r.at?`<div class="row"><span style="color:var(--rd)">Com previsão vencida</span><b style="color:var(--rd)">${r.at}</b></div>`:''}<div class="row"><span>Chegaram, aguardando entrega</span><b>${r.c}</b></div><div class="row"><span>Já recebido (sinais e celular antigo)</span><b>${M(r.rec)}</b></div><div class="row"><span>A receber na entrega</span><b>${M(r.fl)}</b></div>`)(encRes())}</div>
<div class="card"><b>Parados há 30+ dias</b>${old.map(p=>`<div class="row"><span>${e(p.nome)}<small>${e(p.v)}</small></span><span class="chip">${days(p.ent)} dias</span></div>`).join('')||'<p class="nt">Nenhum.</p>'}</div></div>
<p class="nt">Valor negociado não é dinheiro recebido: a troca entra no negociado, mas não no recebido. Margem bruta = negociado − custo, e não é lucro líquido. Dados de exemplo.</p>`},

produtos(){const l=P.filter(p=>(!F.c||p.cat===F.c)&&(!F.s||stt(p)===F.s)&&p.nome.toLowerCase().includes(F.q.toLowerCase()));
return `<button class="bt" id="nw" style="width:100%;margin-bottom:12px">+ Novo produto</button>
<input id="q" placeholder="Buscar produto" value="${e(F.q)}" style="width:100%;margin-bottom:10px;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card)">
<div class="two bar2" style="margin-bottom:8px"><select id="fc"><option value="">Todas as categorias</option>${Object.entries(CATS).map(([a,b])=>`<option value="${a}"${F.c===a?' selected':''}>${e(b)}</option>`).join('')}</select><select id="fs"><option value="">Todos os status</option>${Object.entries(ST).map(([a,b])=>`<option value="${a}"${F.s===a?' selected':''}>${b}</option>`).join('')}</select></div>
<div style="text-align:right;margin-bottom:10px"><button class="bt g" id="cm" style="padding:8px 12px;font-size:13px">⚙ Gerenciar categorias</button></div>
<div class="card">${l.map(p=>{const lw=stt(p)==='disponivel'&&p.min&&p.qtd<=p.min;return `<div class="row" data-id="${p.id}" style="cursor:pointer"><span>${e(p.nome)}<small>${e([p.comp&&'p/ '+p.comp,p.v].filter(Boolean).join(' · '))}</small><small>${e(CATS[p.cat]||'')} · ${p.pub?'na vitrine':'oculto'} · ${p.qtd} un.</small></span><span style="text-align:right"><b>${p.preco?M(p.promo||p.preco):'sem preço'}</b><br><span class="chip ${stt(p)}">${ST[stt(p)]}</span>${lw?' <span class="chip low">estoque baixo</span>':''}</span></div>`}).join('')||'<p class="nt">Nenhum produto.</p>'}</div>`},

vender(){const free=i=>P.filter(p=>p.st==='disponivel'&&av(p)>0&&(p.id==V.it[i].pid||!V.it.some(x=>x.pid==p.id)));
const ed=V.edit?S.find(s=>s.id===V.edit):null;
return `${V.enc?`<div class="pill">Entrega da encomenda de ${e(E.find(x=>x.id===V.enc).cliente)}: o que já foi pago e o celular antigo vieram preenchidos.</div>`:''}${ed?`<div class="pill">Editando a venda de ${ed.data.split('-').reverse().join('/')}. O estoque só muda quando você salvar.</div>`:''}

if(t.id==='ent'){EN.troca=t.checked;encDlg()}});
document.addEventListener('click',x=>{const t=x.target.closest('button');if(!t)return;const D=t.dataset,id=+D.id2,xe=E.find(a=>a.id===id),d=$('#dlg');
if(t.id==='ne'){EN=encNew();encDlg()}
if(EN&&t.id==='enp'){EN.pag.push({f:'Dinheiro',v:Math.max(0,EN.preco-sum(EN.pag,g=>g.v)-(EN.troca?EN.tv:0))});encDlg()}
if(EN&&D.enr!==undefined&&EN.pag.length>1){EN.pag.splice(D.enr,1);encDlg()}
if(EN&&t.id==='ens'){const n=EN;E.push({id:nid++,cliente:n.cli.trim(),contato:n.con.trim(),desc:n.desc.trim(),preco:n.preco,prev:n.prev,st:'aguardando',pag:n.pag.filter(g=>g.v>0).map(g=>({f:g.f,v:g.v,data:day(0)})),troca:n.troca?{nome:n.tn.trim(),valor:n.tv,destino:n.td}:null,pid:0,canc:0});EN=null;d.close();go('encomendas')}
if(D.act==='ev')prevDlg(id);if(D.act==='ep')payDlg(id);if(D.act==='ec')chegDlg(id);if(D.act==='ex')canDlg(id);if(D.act==='ed')entregarEnc(id);
if(t.id==='pvs'){const v=$('#pvn').checked?'':$('#pvd').value;if(v!==xe.prev){if(xe.prev)(xe.hist=xe.hist||[]).push(xe.prev);xe.prev=v}d.close();go('encomendas')}
if(t.id==='epa'){const v=R($('#pdv').value),f=encFl(xe);if(v<=0||v>f){$('#pdm').textContent='Informe um valor de até '+M(f)+'.';return}xe.pag.push({f:$('#pdf').value,v,data:day(0)});d.close();go('encomendas')}
if(t.id==='ecc'){const p=mp(nid++,xe.desc,'celulares','','','novo',0,R($('#cuc').value),xe.preco,0,1,0,'reservado',0,day(0));P.push(p);xe.pid=p.id;xe.st='chegou';d.close();go('encomendas')}
if(t.id==='exy'){xe.canc=1;const p=P.find(a=>a.id===xe.pid);if(p&&p.st==='reservado')p.st='fora';d.close();go('encomendas')}
if(t.id==='cc')EN=null});
document.addEventListener('input',x=>{const t=x.target,D=t.dataset;
if(t.id==='q'){F.q=t.value;const p=t.selectionStart;$('#v').innerHTML=VW.produtos();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
if(view!=='vender'||!V)return;
if(D.if!==undefined||D.iq!==undefined){const k=D.if??D.iq;if(D.if!==undefined)V.it[k].final=R(t.value);else V.it[k].q=Math.max(1,parseInt(t.value)||1);sync();const f=$('[data-pv="0"]');if(f&&V.pag.length===1)f.value=T(V.pag[0].v)}
if(t.id==='tn')V.tn=t.value;if(t.id==='tv')V.tv=R(t.value);
if(D.pv!==undefined)V.pag[D.pv].v=R(t.value);
if(['tn','tv'].includes(t.id)||D.if!==undefined||D.iq!==undefined||D.pv!==undefined)sumUp()});
document.addEventListener('change',x=>{const t=x.target,D=t.dataset;
if(t.dataset.cn){const v=t.value.trim();if(v)CATS[D.cn]=v;else t.value=CATS[D.cn]}
if(t.name==='cat'||t.id==='nt'){const n=t.name==='cat'&&t.value==='__nova';if(t.name==='cat'){$('#nc').hidden=!n;$('#nt').hidden=!n;$('#nc').required=n}const a=tipoAtual()==='a';document.querySelector('.ga').hidden=!a;document.querySelector('.gc').hidden=a}
if(t.id==='fc'){F.c=t.value;go('produtos')}if(t.id==='fs'){F.s=t.value;go('produtos')}
if(view!=='vender'||!V)return;
if(D.ip!==undefined){const p=P.find(a=>a.id==t.value);V.it[D.ip]=p?{pid:p.id,nome:p.nome+(p.v?' · '+p.v:''),q:1,tab:p.promo||p.preco,final:p.promo||p.preco,custo:p.custo,cat:p.cat}:blank();sync();go('vender')}
if(t.id==='vt'){V.troca=t.checked;go('vender')}if(t.id==='td')V.td=t.value;
if(D.pf!==undefined)V.pag[D.pf].f=t.value});
document.addEventListener('click',x=>{const t=x.target.closest('button,.row');if(!t)return;const D=t.dataset,d=$('#dlg');
if(t.id==='nw')form(null);if(D.id&&view==='produtos')form(+D.id);if(t.id==='cm')catDlg();
if(D.sv)vendaDlg(+D.sv);
if(t.id==='vp')imprimir(+D.id2);if(t.id==='ve'){d.close();editVenda(+D.id2)}if(t.id==='vc')vendaDlg(+D.id2,1);if(t.id==='vb')vendaDlg(+D.id2);
if(t.id==='vcy'){const s=S.find(a=>a.id===+D.id2);undo(s);s.canc=1;d.close();go('vendas')}
if(t.id==='cc')d.close();
if(t.id==='ca'){const n=$('#nc2').value;if(n.trim()){addCat(n,$('#nt2').value);catDlg()}else catDlg('Digite o nome da nova categoria.')}
if(D.cd){const k=D.cd;if(P.some(p=>p.cat===k))catDlg('Não dá para apagar: há produtos nessa categoria. Mude esses produtos de categoria primeiro.');else{delete CATS[k];delete CT[k];catDlg()}}
if(view==='vender'&&V){
if(t.id==='ai'){V.it.push(blank());sync();go('vender')}
if(D.ri!==undefined){V.it.splice(D.ri,1);sync();go('vender')}
if(t.id==='ap'){V.pag.push({f:'Dinheiro',v:Math.max(0,rest())});go('vender')}
if(D.rm!==undefined&&V.pag.length>1){V.pag.splice(D.rm,1);go('vender')}
if(t.id==='xe'){V=null;go('vendas')}
if(t.id==='ok')confirmar()}});
$('#dlg').addEventListener('close',()=>{if(view==='produtos'&&$('#v'))$('#v').innerHTML=VW.produtos()});
login();
</script>
</body>
